name: Verify public research and website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mercata-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check scripts/intake.mjs
          node --check scripts/verify.mjs
          node --check site/app.js
      - name: Check public ontology, catalog, queue and website
        run: node scripts/verify.mjs
      - name: Run repository tests
        run: node --test tests/*.test.mjs
