name: Verify public research and website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mercata-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all project JavaScript syntax
        run: |
          # Include every project module and test, not a hand-maintained subset.
          # -P limits startup overhead; a failed node --check fails the whole step.
          find scripts site tests -type f \( -name '*.mjs' -o -name '*.js' \) -print0 | xargs -0 -P 6 -n 1 node --check
      - name: Check public ontology, catalog, queue and website
        run: node scripts/verify.mjs
      - name: Run repository tests
        run: node --test tests/*.test.mjs
      - name: Check YouTube source independence and publication dates
        run: node scripts/audit-youtube-sources.mjs
      - name: Install Firefox automation tools
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps firefox
      - name: Verify website in Firefox at desktop and mobile widths
        run: node tests/site-smoke.mjs
      - name: Check public GitHub Pages response
        run: |
          if curl --fail --silent --show-error --max-time 25 https://sguzman.github.io/mercata/ -o pages-preview.html && grep -q 'id="catalog-grid"' pages-preview.html; then
            echo 'PASS: public Pages endpoint returned the Mercata catalog'
          else
            echo '::warning::Pages endpoint is not yet verifiably serving the latest Mercata catalog'
          fi
      - name: Archive website QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercata-firefox-screenshots
          path: screenshots/
          if-no-files-found: ignore
